<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>SIT 725 Prac 3</title>

    <meta name="description" content="Book Explorer for SIT 725 Prac 3">
    <meta name="author" content="SIT 725 Student">

    <!-- Materialize CSS -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">

    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons"
        rel="stylesheet">

    <!-- Custom Style Sheet -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <!-- Navigation Bar -->
    <nav>
        <div class="nav-wrapper navbar-size">

            <a href="#" class="brand-logo">
                <img class="user-image-size"
                    src="images/Book_icon.png"
                    alt="Book Logo">
            </a>

            <ul id="nav-mobile" class="right hide-on-med-and-down">
                <li>
                    <a href="#">Book Explorer</a>
                </li>
            </ul>

        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-body">

        <div class="container">

            <!-- Heading Section -->
            <div class="row">

                <div class="col s12 center-align">

                    <h1 id="heading">
                        Welcome to Book Explorer
                    </h1>

                    <p class="flow-text">
                        Explore our collection of books and discover your next read.
                    </p>

                </div>

                <!-- Main Image -->
                <div class="col s12 center-align">

                    <img class="materialboxed materialboxed-image"
                        src="images/Books.jpeg"
                        alt="Books">

                </div>

                <!-- Click Me Button -->
                <div class="col s12 center-align">

                    <a class="waves-effect waves-light btn click-me-button"
                        id="clickMeButton">

                        <i class="material-icons left">
                            auto_fix_high
                        </i>

                        Click Me

                    </a>

                </div>

            </div>

            <!-- Book Cards -->
            <div class="row" id="card-section">

                <!-- Cards will be loaded dynamically from MongoDB -->

            </div>

        </div>

    </main>

    <!-- jQuery -->
    <script
        src="https://code.jquery.com/jquery-3.6.0.min.js"
        integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4="
        crossorigin="anonymous">
    </script>

    <!-- Materialize JavaScript -->
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js">
    </script>

    <!-- Custom JavaScript -->
    <script src="js/script.js"></script>

</body>

</html>
